[workspace]
name = "mga4all-algos"
channels = ["conda-forge", "gurobi"]
platforms = ["linux-64", "osx-64", "win-64"]

[dependencies]
python = ">=3.11,<3.14"
jupyterlab = "*"

# optimisation stack
gurobi = "*"
highspy = "*"

# ORACLE backend
cddlib = "*"

[pypi-dependencies]
mga4all = { path = ".", editable = true }
pycddlib = "*"

[tasks]
test = "pytest"
